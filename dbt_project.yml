# dbt transformation layer for the Canadian SME Acquisition Strategy analytical data platform.
# Run every dbt command from the repository root (relative paths below resolve against it).
name: sme_market_intelligence
version: "1.0.0"
config-version: 2
profile: sme_banking

model-paths: ["models"]
macro-paths: ["macros"]
test-paths: ["tests"]
# Reviewed crosswalks stay in data/reference/crosswalks (single authoritative copy) and are loaded
# as seeds from there; seeds/ holds small reviewed code maps that were constants in the Python layer.
seed-paths: ["seeds", "data/reference/crosswalks"]
target-path: "target"

flags:
  send_anonymous_usage_stats: false

models:
  sme_market_intelligence:
    staging:
      +schema: staging
      +materialized: view
      crm:
        +tags: ["crm_data"]
    intermediate:
      +schema: intermediate
      +materialized: table
      opportunity:
        +tags: ["opportunity"]
      crm:
        +tags: ["crm_data"]
      lead_routing:
        +tags: ["lead_routing"]
      acquisition_intelligence:
        +tags: ["acquisition_intelligence"]
    marts:
      +schema: analytics
      +materialized: table
      opportunity_framework:
        +tags: ["opportunity"]
      crm:
        +tags: ["crm_data"]
      lead_routing:
        +tags: ["lead_routing"]
      acquisition_intelligence:
        +tags: ["acquisition_intelligence"]

# Synthetic CRM data tests (tests/crm): selected with tag:crm_data, excluded from the base and opportunity runs.
data_tests:
  sme_market_intelligence:
    crm:
      +tags: ["crm_data"]
    lead_routing:
      +tags: ["lead_routing"]
    acquisition_intelligence:
      +tags: ["acquisition_intelligence"]

seeds:
  sme_market_intelligence:
    +schema: reference
    opportunity:
      +tags: ["opportunity"]
    lead_routing:
      +tags: ["lead_routing"]
    acquisition_intelligence:
      +tags: ["acquisition_intelligence"]

# Constants shared by several models (defined once; tests check them against the sources where the source states them).
vars:
  statcan_0722_source_id: "StatCan 33-10-0722-01"
  statcan_1097_source_id: "StatCan 33-10-1097-01"
  ised_source_id: "ISED SFGSME 2023"
  snapshot_period_1097: "December 2025"
  source_ref_date_1097: "2025-07"
  pandemic_window_start: "2020-03"
  pandemic_window_end: "2021-12"
  ised_survey_year: 2023
  ised_national_label: "1 to 499 employees"
  # Market opportunity framework windows (0722 monthly; same windows as the descriptive market exploration)
  opportunity_recent_start: "2025-06"
  opportunity_recent_end: "2026-05"
  opportunity_trend_start: "2023-06"
  opportunity_recent_months: 12
  opportunity_trend_min_months: 30
  # Synthetic CRM data: market-context scenario joined to leads (A-010; simulation setting, not approved policy)
  crm_market_context_scenario: "balanced"
  # Lead prioritization and capacity-aware RM routing (declared configuration; hypothetical rules, synthetic data)
  lead_routing_rule_version: "lr-v1.0"
