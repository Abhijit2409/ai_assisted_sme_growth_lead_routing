version: 2

# Synthetic CRM data (fictional bank, fictional businesses and staff) and the reviewed CRM design catalogs.
# Paths are relative to the repository root. Ground truth (data/synthetic/crm_ground_truth) is deliberately NOT declared:
# it is read only by src/validation/17_validate_synthetic_crm_data.py and must never feed a model.

sources:
  - name: synthetic_crm
    description: >
      Synthetic CRM operating history for the hypothetical SME acquisition process (fictional bank; no real customer,
      employee, business, contact or banking information). Generated by src/synthetic/16_generate_synthetic_crm_data.py
      (generator version 1.0.0, master random seed 20260929) for the UTC period 2025-06-01 to 2026-05-31, one Parquet file per
      logical entity with columns exactly as data/design/crm/crm_field_dictionary.csv. Identifiers are fixed-width fictional
      codes (PRS-, LED-, RM-, ASG-, ...); emails use reserved .example domains and telephone numbers the fictional 555-01xx range.
      Every rate, SLA, capacity value and outcome is a simulation setting, never a benchmark for a real bank.
      Validated by src/validation/17_validate_synthetic_crm_data.py; hashes in data/synthetic/crm/synthetic_crm_manifest.csv.
    tags: ["crm_data"]
    tables:
      - name: crm_business_prospect
        description: >
          A synthetic business that may become a client; one business can generate several leads. Grain: one row per synthetic business prospect. Primary key: prospect_id.
          Foreign keys: none. Record type: current-state. Synthetic origin; design entity E-01.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_business_prospect.parquet')"
        columns:
          - name: prospect_id
            description: "Surrogate key of the synthetic prospect."
          - name: synthetic_business_id
            description: "Synthetic business identifier used for exact duplicate matching (never a real business number)."
          - name: legal_name
            description: "Fictional legal business name."
          - name: normalized_legal_name
            description: "Legal name normalized for duplicate matching (case, punctuation, legal suffix removed)."
          - name: operating_name
            description: "Fictional operating name if different."
          - name: employee_band
            description: "Employee-size band stated or estimated at capture."
          - name: industry_system
            description: "Industry classification system."
          - name: industry_code
            description: "Reviewed NAICS 2022 sector code from analytics.dim_industry."
          - name: country_code
            description: "Country of operation."
          - name: existing_relationship_flag
            description: "Prospect already holds a synthetic banking relationship (excluded from acquisition)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_lead
        description: >
          An acquisition request for a prospect captured through a channel. Grain: one row per lead. Primary key: lead_id.
          Foreign keys: prospect_id -> crm_business_prospect; duplicate_group_id -> crm_duplicate_group; surviving_lead_id -> crm_lead; territory_id -> crm_territory; cma_code_sgc2021 -> analytics.dim_cma. Record type: current-state (with derived current status). Synthetic origin; design entity E-02.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_lead.parquet')"
        columns:
          - name: lead_id
            description: "Surrogate key of the lead."
          - name: prospect_id
            description: "Prospect the lead refers to."
          - name: captured_at
            description: "Lead capture time (UTC)."
          - name: first_channel_code
            description: "Channel of the first source touch."
          - name: contact_role
            description: "Role of the (fictional) contact person; no name stored in analytical models."
          - name: contact_email_fictional
            description: "Fictional contact email on a reserved .example domain; excluded from analytical marts."
          - name: contact_phone_fictional
            description: "Fictional phone number using exchange 555 with line 0100-0199 (reserved for fictional use); excluded from analytical marts."
          - name: postal_fsa
            description: "Forward sortation area of the business location (geography, not an address)."
          - name: province_code
            description: "SGC province or territory code from the address."
          - name: cma_code_sgc2021
            description: "Resolved SGC 2021 CMA code; null outside the 41-CMA spine."
          - name: territory_id
            description: "Resolved territory."
          - name: geography_status
            description: "Outcome of geographic resolution."
          - name: market_evidence_flag
            description: "Market-context availability for the lead's CMA."
          - name: stated_product_interest
            description: "Product interest stated at capture."
          - name: stated_service_language
            description: "Service language explicitly stated by the prospect; never inferred."
          - name: consent_to_contact_flag
            description: "Prospect consented to be contacted."
          - name: priority_band
            description: "Priority band from a later model; default P2 until the model exists."
          - name: current_lead_status
            description: "Current lead status, derived from the latest status-history row."
          - name: disposition_code
            description: "Disposition for terminal leads."
          - name: duplicate_group_id
            description: "Duplicate group, if any."
          - name: surviving_lead_id
            description: "Survivor for MERGED leads."
          - name: local_time_zone
            description: "IANA time zone of the lead's province, used for business-hour SLA clocks; the configured default zone when the province is unknown."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_lead_source_touch
        description: >
          Every channel touch that created or re-created a lead, preserved through duplicate merges. Grain: one row per lead source touch. Primary key: source_touch_id.
          Foreign keys: lead_id -> crm_lead; original_lead_id -> crm_lead; channel_code -> crm_acquisition_channel; campaign_id -> crm_campaign. Record type: event history. Synthetic origin; design entity E-03.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_lead_source_touch.parquet')"
        columns:
          - name: source_touch_id
            description: "Surrogate key of the source touch."
          - name: lead_id
            description: "Lead that currently holds the touch (the survivor after a merge)."
          - name: original_lead_id
            description: "Lead originally created by the touch; never changed by merges."
          - name: channel_code
            description: "Acquisition channel of the touch."
          - name: touched_at
            description: "Time of the touch."
          - name: campaign_id
            description: "Campaign for CH-MKT touches."
          - name: partner_code
            description: "Fictional partner code for CH-PTR touches."
          - name: referring_branch_code
            description: "Fictional branch code for CH-BRN touches."
          - name: prospecting_rm_id
            description: "Prospecting RM for CH-RMP touches."
          - name: is_first_touch
            description: "First touch of the surviving lead (first-touch attribution)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_acquisition_channel
        description: >
          Controlled channel catalog. Grain: one row per channel. Primary key: channel_code.
          Foreign keys: none. Record type: reference. Synthetic origin; design entity E-04.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_acquisition_channel.parquet')"
        columns:
          - name: channel_code
            description: "Channel code from the acquisition channel catalog."
          - name: channel_name
            description: "Business name of the channel."
          - name: default_assignment_sla_id
            description: "Assignment SLA applied to the channel."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_campaign
        description: >
          Synthetic marketing campaigns used for attribution. Grain: one row per campaign. Primary key: campaign_id.
          Foreign keys: none. Record type: reference (effective-dated). Synthetic origin; design entity E-05.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_campaign.parquet')"
        columns:
          - name: campaign_id
            description: "Surrogate key."
          - name: campaign_code
            description: "Fictional campaign code."
          - name: campaign_name
            description: "Fictional campaign name."
          - name: target_segment
            description: "Target SME segment."
          - name: campaign_start_date
            description: "Start date."
          - name: campaign_end_date
            description: "End date."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_relationship_manager
        description: >
          Synthetic relationship managers who own leads. Grain: one row per synthetic RM. Primary key: rm_id.
          Foreign keys: home_territory_id -> crm_territory. Record type: current-state (effective-dated employment). Synthetic origin; design entity E-06.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_relationship_manager.parquet')"
        columns:
          - name: rm_id
            description: "Surrogate key of the synthetic RM (no real employee)."
          - name: rm_code
            description: "Fictional RM code; no names are stored."
          - name: rm_segment
            description: "Segment the RM serves."
          - name: home_territory_id
            description: "Primary territory."
          - name: supported_service_languages
            description: "Service languages the RM supports (for explicitly stated preferences only)."
          - name: base_capacity_points
            description: "Base weighted capacity (CAP-05; configurable)."
          - name: employment_start_date
            description: "Synthetic start date."
          - name: employment_end_date
            description: "Synthetic end date; null if active."
          - name: active_flag
            description: "Currently active."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_territory
        description: >
          Hypothetical territory definitions keyed on SGC 2021 geography. Grain: one row per territory. Primary key: territory_id.
          Foreign keys: cma_code_sgc2021 -> analytics.dim_cma. Record type: reference. Synthetic origin; design entity E-07.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_territory.parquet')"
        columns:
          - name: territory_id
            description: "Surrogate key."
          - name: territory_code
            description: "Business code."
          - name: territory_type
            description: "Territory type (TER rules)."
          - name: cma_code_sgc2021
            description: "SGC 2021 CMA code for cma territories."
          - name: province_code
            description: "Province code for province_remainder territories."
          - name: sales_region
            description: "Hypothetical sales region grouping."
          - name: evidence_tier
            description: "Evidence tier of the CMA (from analytics.dim_cma)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_rm_territory
        description: >
          Which RM covers which territory, and when. Grain: one row per RM x territory x effective period. Primary key: rm_territory_id.
          Foreign keys: rm_id -> crm_relationship_manager; territory_id -> crm_territory. Record type: effective-dated relationship. Synthetic origin; design entity E-08.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_rm_territory.parquet')"
        columns:
          - name: rm_territory_id
            description: "Surrogate key."
          - name: rm_id
            description: "RM."
          - name: territory_id
            description: "Territory covered."
          - name: coverage_role
            description: "Coverage role."
          - name: valid_from
            description: "Coverage start."
          - name: valid_to
            description: "Coverage end; null if open."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_rm_specialization
        description: >
          Industry specializations held by RMs, keyed on reviewed industry codes. Grain: one row per RM x industry x effective period. Primary key: rm_specialization_id.
          Foreign keys: rm_id -> crm_relationship_manager; (industry_system, industry_code) -> analytics.dim_industry. Record type: effective-dated relationship. Synthetic origin; design entity E-09.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_rm_specialization.parquet')"
        columns:
          - name: rm_specialization_id
            description: "Surrogate key."
          - name: rm_id
            description: "RM."
          - name: industry_system
            description: "Industry system."
          - name: industry_code
            description: "Reviewed NAICS 2022 sector code (SPC catalog)."
          - name: specialist_type
            description: "Specialist type from the specialist rule catalog."
          - name: valid_from
            description: "Start."
          - name: valid_to
            description: "End; null if open."
          - name: specialization_role
            description: "primary for dedicated specialists (mandatory industries); secondary for generalists who also hold a preferred-industry specialization."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_rm_capacity_snapshot
        description: >
          Daily RM availability and weighted workload. Grain: one row per employed RM x business day (national business calendar). Primary key: capacity_snapshot_id.
          Foreign keys: rm_id -> crm_relationship_manager; rule_version_id -> crm_rule_version. Record type: snapshot. Synthetic origin; design entity E-10.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_rm_capacity_snapshot.parquet')"
        columns:
          - name: capacity_snapshot_id
            description: "Surrogate key."
          - name: rm_id
            description: "RM."
          - name: snapshot_date
            description: "Business date of the snapshot."
          - name: availability_status
            description: "Availability on the date."
          - name: available_capacity_points
            description: "Capacity after availability pro-rating (CAP-08)."
          - name: weighted_workload_points
            description: "Weighted workload (CAP-01..CAP-04)."
          - name: utilization_ratio
            description: "Workload / available capacity; null when capacity is 0."
          - name: capacity_state
            description: "State against CAP-06/CAP-09."
          - name: rule_version_id
            description: "Capacity rule version applied."
          - name: snapshot_as_of_utc
            description: "Instant the snapshot describes: 00:00 UTC on snapshot_date, before any business-hour activity in Canada that day."
          - name: specialist_support_points
            description: "Part of weighted_workload_points that comes from specialist-support (secondary) assignments (CAP-04)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_routing_decision
        description: >
          Every routing evaluation with inputs, rule version and outcome. Grain: one row per routing decision. Primary key: routing_decision_id.
          Foreign keys: lead_id -> crm_lead; selected_rm_id -> crm_relationship_manager; rule_version_id -> crm_rule_version. Record type: event history. Synthetic origin; design entity E-11.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_routing_decision.parquet')"
        columns:
          - name: routing_decision_id
            description: "Surrogate key."
          - name: lead_id
            description: "Lead routed."
          - name: decided_at
            description: "Decision time."
          - name: lead_status_at_decision
            description: "Lead status when decided (RT-E04)."
          - name: routing_outcome
            description: "Outcome."
          - name: selected_rm_id
            description: "Selected RM; null for queue outcomes."
          - name: candidate_count
            description: "Eligible candidates after exclusions."
          - name: excluded_rm_count
            description: "RMs excluded by RT-X rules."
          - name: territory_match_flag
            description: "True when the selected RM holds a primary coverage of the lead's territory valid at decision time (national and remote pools count as matched); false for backup coverage or an out-of-territory RM; null for queue outcomes."
          - name: segment_match_flag
            description: "Segment matched (RT-P02)."
          - name: specialist_match_flag
            description: "Specialist matched when required or preferred."
          - name: language_match_flag
            description: "Stated language matched; null when not stated."
          - name: capacity_utilization_at_decision
            description: "Selected RM's utilization at decision time."
          - name: tie_break_applied_flag
            description: "Tie-breaking rule used (RT-L02)."
          - name: rule_trace
            description: "Ordered rule IDs evaluated, with outcome codes."
          - name: manual_review_reason
            description: "Reason for manual review."
          - name: market_scenario_id
            description: "Market-opportunity scenario used as context."
          - name: rule_version_id
            description: "Routing rule version."
          - name: decision_type
            description: "Why the routing evaluation ran: first routing of a READY_FOR_ASSIGNMENT lead, reassignment of an active lead, release of a queued lead, or a manager override."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_lead_assignment
        description: >
          Ownership of a lead by an RM or queue over time. Grain: one row per assignment. Primary key: assignment_id.
          Foreign keys: lead_id -> crm_lead; rm_id -> crm_relationship_manager; routing_decision_id -> crm_routing_decision; prior_assignment_id -> crm_lead_assignment; rule_version_id -> crm_rule_version. Record type: effective-dated relationship with status. Synthetic origin; design entity E-12.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_lead_assignment.parquet')"
        columns:
          - name: assignment_id
            description: "Surrogate key."
          - name: lead_id
            description: "Lead."
          - name: rm_id
            description: "Assigned RM; null for QUEUED assignments."
          - name: queue_code
            description: "Queue for QUEUED assignments."
          - name: assignment_role
            description: "Primary owner or specialist support."
          - name: assignment_status
            description: "Assignment status."
          - name: active_flag
            description: "Assignment active (QUEUED, ASSIGNED, ACKNOWLEDGED or REASSIGNMENT_PENDING)."
          - name: assigned_at
            description: "Assignment (or queue) time."
          - name: assignment_reason
            description: "Why the assignment exists."
          - name: routing_decision_id
            description: "Routing decision that produced it."
          - name: rule_version_id
            description: "Rule version used."
          - name: prior_assignment_id
            description: "Assignment it replaced (reassignment)."
          - name: prior_rm_id
            description: "Previous owner, when reassigned."
          - name: acknowledged_at
            description: "Acknowledgement time."
          - name: declined_at
            description: "Decline time."
          - name: decline_reason
            description: "Decline reason."
          - name: reassignment_triggered_at
            description: "When a reassignment condition occurred."
          - name: reassignment_reason
            description: "Why reassignment happened."
          - name: ended_at
            description: "End time for ended assignments."
          - name: manual_override_flag
            description: "Created or ended by a manager override (RT-O01)."
          - name: override_reason_code
            description: "Override reason."
          - name: override_user_role
            description: "Role that applied the override."
          - name: capacity_exception_flag
            description: "Assignment made above the hard limit under CAP-09."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_lead_activity
        description: >
          Contact attempts, conversations, meetings and nurture tasks. Grain: one row per activity. Primary key: activity_id.
          Foreign keys: lead_id -> crm_lead; rm_id -> crm_relationship_manager; assignment_id -> crm_lead_assignment. Record type: event history. Synthetic origin; design entity E-13.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_lead_activity.parquet')"
        columns:
          - name: activity_id
            description: "Surrogate key."
          - name: lead_id
            description: "Lead."
          - name: assignment_id
            description: "Assignment under which the activity happened."
          - name: rm_id
            description: "RM who performed it."
          - name: activity_at
            description: "Time of the activity."
          - name: activity_type
            description: "Activity type."
          - name: activity_outcome
            description: "Outcome."
          - name: counts_as_contact_attempt
            description: "Counts toward first-contact and attempt limits."
          - name: next_contact_due_at
            description: "Next scheduled contact (nurturing)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_lead_status_history
        description: >
          Every lead status change with its transition and event. Grain: one row per lead status change. Primary key: status_history_id.
          Foreign keys: lead_id -> crm_lead; transition_id -> lead_transition_rules. Record type: event history. Synthetic origin; design entity E-14.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_lead_status_history.parquet')"
        columns:
          - name: status_history_id
            description: "Surrogate key."
          - name: lead_id
            description: "Lead."
          - name: from_status
            description: "Previous status; null for the first row (NEW)."
          - name: to_status
            description: "New status."
          - name: transition_id
            description: "Transition rule applied; null for the first row."
          - name: event_code
            description: "Triggering event."
          - name: changed_at
            description: "Time of the change."
          - name: disposition_code
            description: "Disposition when to_status is terminal."
          - name: actor_role
            description: "Role or system that made the change."
          - name: reopen_approver_role
            description: "Approver for audited reopenings."
          - name: status_reason
            description: "Reason attached to the status change: validation failure (T-01), release to queue (T-15) or audited reopening (T-28, T-29)."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_sla_event
        description: >
          SLA clocks and their warning, breach, met and escalation events. Grain: one row per SLA clock instance per lead or assignment. Primary key: sla_event_id.
          Foreign keys: lead_id -> crm_lead; assignment_id -> crm_lead_assignment; rule_version_id -> crm_rule_version. Record type: event history. Synthetic origin; design entity E-15.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_sla_event.parquet')"
        columns:
          - name: sla_event_id
            description: "Surrogate key."
          - name: lead_id
            description: "Lead."
          - name: assignment_id
            description: "Assignment, for RM SLAs."
          - name: sla_id
            description: "SLA rule from the SLA catalog."
          - name: started_at
            description: "Clock start (start event time)."
          - name: target_at
            description: "Breach time computed on the SLA's time basis."
          - name: warning_at
            description: "Warning time."
          - name: stopped_at
            description: "Clock stop (stop event time); null while open."
          - name: stop_event_code
            description: "Event that stopped the clock."
          - name: sla_outcome
            description: "Outcome."
          - name: paused_minutes
            description: "Business minutes paused under the SLA's pause conditions."
          - name: escalation_level
            description: "Highest escalation reached."
          - name: rule_version_id
            description: "SLA rule version."
          - name: responsible_role
            description: "Role responsible for the clock, copied from the SLA rule at clock start."
          - name: elapsed_business_minutes
            description: "Business minutes (or calendar minutes for calendar-basis SLAs) from started_at to stopped_at, or to the data cut-off when open, minus paused minutes."
          - name: exception_reason
            description: "Why the clock was paused or exempted."
          - name: created_at
            description: "Time the record was created (UTC)."
          - name: updated_at
            description: "Time the record was last updated (UTC); null for immutable event rows."
          - name: record_source
            description: "System that produced the record; always the synthetic generator."
      - name: crm_duplicate_group
        description: >
          A set of leads judged to be the same business, with the survivor. Grain: one row per duplicate group. Primary key: duplicate_group_id.
          Foreign keys: surviving_lead_id -> crm_lead; matched_lead_id -> crm_lead. Record type: current-state. Synthetic origin; design entity E-16.
        meta:
          external_location: "read_parquet('data/synthetic/crm/crm_duplicate_group.parquet')"
        columns:
          - name: duplicate_group_id
            description: "Surrogate key."
          - name: match_rule_id
            description: "Duplicate rule that matched."
          - name: match_tier
            description: "Tier."
          - name: review_decision
            description: "Human decision for review-tier groups."
