        description: >
          The qualified pursuit opened from a lead and its outcome. Grain: one row per opportunity (at most one per lead). Primary key: opportunity_id.
          Foreign keys: lead_id -> crm_lead; rm_id -> crm_relationship_manager. Record type: current-state with outcome. Synthetic origin; design entity E-17.
