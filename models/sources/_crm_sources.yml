      - name: crm_rule_version
        description: >
          Versioned configuration of routing, SLA, capacity and duplicate rules. Grain: one row per rule set x version. Primary key: rule_version_id.
          Foreign keys: none. Record type: reference (effective-dated). Synthetic origin; design entity E-18.
        meta:
