  - name: fact_cma_size_composition_snapshot
    description: |
      Business purpose: SME-location composition by broad employment-size band per CMA.
      Row grain: one row per CMA x band. Primary key: cma_code_sgc2021, size_band_key, snapshot_period.
      Upstream: StatCan 33-10-1097-01 only (bands rolled up with bridge_size_band). Statistical unit: employer location.
      Period: December 2025 (REF_DATE 2025-07). Geographic coverage: 41 CMAs. Industry coverage: total, all industries.
      Size coverage: 1-4, 5-19, 20-99, 100-499 and 500+ (500+ outside the SME share).
      Exclusions: none. Missing values: omitted cells are zero by reconciliation and counted.
      Limitations: location-based employment-size composition, not enterprise size.
      Public aggregates only: rows describe markets, never individual businesses, prospects or leads.
    data_tests:
