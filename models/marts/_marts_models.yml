  - name: fact_ised_financing_context
    description: |
      Business purpose: survey context on SME financing demand, outcomes and deal size. Contextual evidence only; never a market-score input.
      Row grain: one row per ISED table x measure x one-way segment. Primary key: ised_table, measure_id, segment_dimension, segment_key.
      Upstream: ISED SFGSME 2023 only (parsed workbook cache), segments coded through reviewed crosswalks E2, E4 and E8.
      Statistical unit: weighted survey estimates (percentages, dollars, weighted SME counts) and unweighted respondent counts.
      Period: calendar 2023. Geographic coverage: national, 10 ISED regions/provinces, 24 Tier 1 CMAs. Industry coverage: 10 ISED industry groups.
      Size coverage: 4 ISED SME bands (1-499 overall). Population: SMEs with 1-499 employees and at least $30,000 revenue, with survey industry exclusions.
      Exclusions: Tables 1, 3, 4, 49 by national, size, CMA, region and industry group; Table 5 (deal size) national and size band only; special aggregates and Table 50 (a two-way cross) excluded.
      Missing values: '..' and blank stay NULL; F estimates keep their published value for audit but have no usable value; E estimates carry a caution flag.
      Limitations: percentages are never converted into counts; one-way segments are never multiplied into CMA x industry x size cells; regional values are never attached to CMAs.
      Public aggregates only: rows describe markets, never individual businesses, prospects or leads.
    data_tests:
      - unique_key_combination:
          arguments:
            columns: ["ised_table", "measure_id", "segment_dimension", "segment_key"]
      - row_count_equals:
          arguments:
            expected: 1497
    columns:
      - name: source_id
        description: "Source identity of the row (one source per fact table)."
        data_tests:
          - not_null
      - name: survey_year
        description: "Survey reference year (2023)."
        data_tests:
          - not_null
      - name: period_label
        description: "Period basis of the row."
      - name: ised_table
        description: "ISED table number."
      - name: measure_id
        description: "ISED measure identifier (table and column block)."
      - name: measure_label
        description: "Measure label."
      - name: estimate_type
        description: "Estimate type (percentage_of_universe, weighted_count, average_monetary, ...)."
      - name: unit
        description: "Published unit of the estimate."
      - name: universe_or_denominator
        description: "Population the estimate refers to (all SMEs in the segment, requesters, ...)."
      - name: statistical_unit
        description: "Statistical unit of the value on this row."
        data_tests:
          - not_null
      - name: scope_class
        description: "Scope label: all-employer-business context, small-business measure, SME-specific measure, SME-location measure, outside SME scope (500+), filtered SME survey measure, ..."
      - name: metric_id
        description: "Metric identifier from the approved metric list, where the row serves one."
      - name: segment_dimension
        description: "One-way segment dimension: national, size_band, cma, region or industry_group."
        data_tests:
          - accepted_values:
              arguments:
                values: ["national", "size_band", "cma", "region", "industry_group"]
      - name: segment_key
        description: "Code of the segment: CANADA, size-band key, SGC 2021 CMA code (Tier 1 only), region key or ISED industry code."
        data_tests:
          - not_null
      - name: segment_label_published
        description: "Verbatim ISED row text (audit only)."
      - name: segment_level
        description: "ISED row level (category or subcategory)."
      - name: nested_region_flag
        description: "True for regions nested inside another region row (never added to it)."
      - name: non_additive_rule_id
        description: "E7 rule governing the member or region (never summed as a mutually exclusive group)."
      - name: geography_caveat
        description: "Geography caveat of the segment."
      - name: value_published
        description: "Published estimate; NULL for '..' and blank cells."
      - name: value_state
        description: "published, published_E, suppressed_x, not_available_dotdot, derived, derived_E, unavailable_input or no_prior_month."
      - name: quality_code
        description: "ISED quality code A-F (NULL where none is printed)."
        data_tests:
          - accepted_values:
              arguments:
                values: ["A", "B", "C", "D", "E", "F"]
      - name: error_value
        description: "Printed standard error or coefficient of variation."
      - name: se_or_cv
        description: "Whether error_value is a standard error (SE) or a coefficient of variation (CV)."
      - name: caution_flag
        description: "True where the value, or any input of a derived value, is flagged E (use with caution)."
      - name: excluded_quality_f
        description: "True for F estimates (CV 30%+): excluded from usable comparisons."
      - name: dotdot_flag
        description: "True for '..' (unavailable; never zero)."
      - name: mvp_use_status
        description: "usable_A_to_D, usable_with_caution_E, excluded_quality_F, unavailable_dotdot or unavailable_blank."
        data_tests:
          - accepted_values:
              arguments:
                values: ["usable_A_to_D", "usable_with_caution_E", "excluded_quality_F", "unavailable_dotdot", "unavailable_blank", "published_without_quality_code"]
      - name: source_stub_row
        description: "Worksheet stub row of the cell (lineage)."
      - name: value_usable
        description: "Estimate usable for descriptive comparison (A-E); NULL for F, '..' and blank."
